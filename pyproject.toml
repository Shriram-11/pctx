[project]
name = "pctx"
version = "0.1.0"
description = "Local-first CLI tool for indexing and navigating Markdown documentation."
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
pctx = "pctx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
